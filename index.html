<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional PDF to Word Converter</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 25px; max-width: 500px; margin: 40px auto; background: #f1f5f9; }
    .card { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin-top: 0; color: #0f172a; font-size: 22px; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; }
    .drop-zone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 25px; margin: 20px 0; background: #f8fafc; }
    input[type="file"] { width: 100%; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; padding: 14px 20px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 18px; font-size: 14px; font-weight: 500; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #0284c7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h2>PDF to Word (AI Engine)</h2>
  <p>100% सटीक टेबल ग्रिड, ओरिजिनल फॉन्ट और बैकग्राउंड कलर के साथ कनवर्ट करें</p>
  
  <div class="drop-zone">
    <input type="file" id="pdfInput" accept="application/pdf">
  </div>
  
  <button id="convertBtn" onclick="uploadAndConvert()">Word (.docx) में बदलें</button>
  
  <div id="status"></div>
</div>

<script>
  // आपका लाइव Hugging Face Python API लिंक
  const API_URL = "https://pdf-converter-api-udp7.onrender.com/convert";

  async function uploadAndConvert() {
    const fileInput = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');

    if (!fileInput.files[0]) {
      alert("कृपया एक PDF फ़ाइल चुनें!");
      return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);

    btn.disabled = true;
    status.innerHTML = '<span class="spinner"></span> Python इंजन टेबल और फ़ॉर्मेटिंग प्रोसेस कर रहा है... (2-4 सेकंड)';
    status.style.color = "#0284c7";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("सर्वर से कनेक्ट नहीं हो सका (Status: " + response.status + ")");
      }

      status.innerText = "फ़ाइल तैयार है, डाउनलोड हो रही है...";
      status.style.color = "#16a34a";

      const blob = await response.blob();
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = downloadUrl;
      a.download = file.name.replace(/\.[^/.]+$/, "") + "_converted.docx";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(downloadUrl);

      status.innerText = "सफलतापूर्वक पूरा हुआ! Word (.docx) डाउनलोड हो गई।";
    } catch (err) {
      console.error(err);
      status.innerText = "त्रुटि: " + err.message;
      status.style.color = "#dc2626";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
