<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline PDF to Word OCR</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 20px; }
    input[type="file"] { width: 100%; margin: 15px 0; }
    button { background: #0066cc; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #a0c4eb; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; color: #444; word-break: break-word; }
    textarea { width: 100%; height: 140px; margin-top: 15px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; padding: 8px; font-size: 13px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

<div class="card">
  <h2>PDF to Word (OCR)</h2>
  <p style="font-size: 13px; color: #666;">फाइल आपके ब्राउज़र में ही प्रोसेस होती है (100% प्राइवेट):</p>
  
  <input type="file" id="pdfInput" accept="application/pdf">
  <button id="convertBtn" onclick="processPDF()">Word (.docx) में बदलें</button>
  
  <div id="status"></div>
  <textarea id="output" placeholder="पहचाना गया टेक्स्ट यहाँ दिखेगा..." readonly></textarea>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function processPDF() {
    const fileInput = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const btn = document.getElementById('convertBtn');

    if (!fileInput.files[0]) {
      alert("कृपया PDF फाइल चुनें!");
      return;
    }

    btn.disabled = true;
    output.value = "";
    status.innerText = "PDF पढ़ी जा रही है...";

    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    
    let fullText = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      status.innerText = `पेज ${pageNum} / ${pdf.numPages} का OCR स्कैन जारी है...`;
      
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      // हिंदी और अंग्रेजी दोनों टेक्स्ट स्कैन करने के लिए 'eng+hin' या सिर्फ 'eng'
      const worker = await Tesseract.createWorker('eng+hin');
      const ret = await worker.recognize(canvas);
      fullText += `--- Page ${pageNum} ---\n` + ret.data.text + "\n\n";
      output.value = fullText;
      await worker.terminate();
    }

    status.innerText = "Word फाइल तैयार हो रही है...";

    const doc = new docx.Document({
      sections: [{
        children: fullText.split('\n').map(line => new docx.Paragraph({
          children: [new docx.TextRun(line)]
        }))
      }]
    });

    const blob = await docx.Packer.toBlob(doc);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = file.name.replace(".pdf", "") + "_ocr.docx";
    link.click();

    status.innerText = "सफलतापूर्वक पूरा हुआ! Word फाइल डाउनलोड हो गई।";
    btn.disabled = false;
  }
</script>
</body>
</html>
