<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCH Price List to Word Converter</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 25px; max-width: 550px; margin: auto; background: #f1f5f9; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #0f172a; font-size: 20px; }
    input[type="file"] { width: 100%; margin: 15px 0; }
    button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #bae6fd; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; color: #334155; font-weight: 500; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

<div class="card">
  <h2>PDF to Word (Color & Table Grid)</h2>
  <p style="font-size: 13px; color: #64748b;">प्राइस लिस्ट PDF को हूबहू टेबल, बॉर्डर और रंगों के साथ Word में बदलें:</p>
  
  <input type="file" id="pdfInput" accept="application/pdf">
  <button id="convertBtn" onclick="processPDF()">Word (.docx) में बदलें</button>
  
  <div id="status"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function processPDF() {
    const fileInput = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');

    if (!fileInput.files[0]) {
      alert("कृपया अपनी PDF फ़ाइल चुनें!");
      return;
    }

    btn.disabled = true;
    status.innerText = "PDF लोड हो रही है...";

    try {
      const file = fileInput.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const textContent = await page.getTextContent();

      status.innerText = "टेबल और कॉलम पहचाने जा रहे हैं...";

      // 1. शब्दों को Y कोऑर्डिनेट (पंक्ति / Row) के आधार पर इकट्ठा करना
      const rowsMap = new Map();
      const tolerance = 6; // एक ही रो के शब्दों के लिए

      textContent.items.forEach(item => {
        const str = item.str.trim();
        if (!str) return;

        const y = Math.round(item.transform[5]);
        const x = Math.round(item.transform[4]);

        let foundY = null;
        for (let k of rowsMap.keys()) {
          if (Math.abs(k - y) <= tolerance) {
            foundY = k;
            break;
          }
        }

        if (foundY !== null) {
          rowsMap.get(foundY).push({ x, str });
        } else {
          rowsMap.set(y, [{ x, str }]);
        }
      });

      // ऊपर से नीचे रो सॉर्ट करना
      const sortedY = Array.from(rowsMap.keys()).sort((a, b) => b - a);

      // 8 कॉलम की अनुमानित X सीमाएं (PDF लेआउट के आधार पर)
      // SN | Phase | HP | Item Discription | Cat Code | MRP | Discount % | Billing Price
      const colBounds = [0, 50, 110, 160, 370, 470, 530, 600, 1000];

      const tableRows = [];

      sortedY.forEach(y => {
        let items = rowsMap.get(y);
        items.sort((a, b) => a.x - b.x);

        const rowText = items.map(i => i.str).join(" ");

        // क्या यह पीला सेक्शन हेडर है? (जैसे: "Single Phase Panel...", "Three Phase...", "02-Jan-2026")
        const isYellowHeader = rowText.includes("Panel") || rowText.includes("Starter") || rowText.includes("Jan-2026");
        // क्या यह मुख्य कॉलम हेडर है?
        const isBlueHeader = rowText.includes("SN") && rowText.includes("Phase");

        if (isYellowHeader) {
          // पूरी 8 कॉलम चौड़ी मर्ज जैसी रो (पीला रंग)
          const cell = new docx.TableCell({
            children: [new docx.Paragraph({
              alignment: docx.AlignmentType.CENTER,
              children: [new docx.TextRun({ text: rowText, bold: true, size: 18, font: "Calibri" })]
            })],
            columnSpan: 8,
            shading: { fill: "FFFF00", type: docx.ShadingType.CLEAR }, // पीला रंग
            borders: {
              top: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
              bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
              left: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
              right: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
            }
          });
          tableRows.push(new docx.TableRow({ children: [cell] }));
        } else {
          // 8 खानों (Cells) वाली सामान्य रो बनाना
          let cellsData = new Array(8).fill("");

          items.forEach(it => {
            // X पोजीशन के हिसाब से कॉलम तय करना
            for (let c = 0; c < 8; c++) {
              if (it.x >= colBounds[c] && it.x < colBounds[c + 1]) {
                cellsData[c] = cellsData[c] ? cellsData[c] + " " + it.str : it.str;
                break;
              }
            }
          });

          const rowCells = cellsData.map((val, idx) => {
            return new docx.TableCell({
              children: [new docx.Paragraph({
                alignment: (idx >= 5 || idx === 0) ? docx.AlignmentType.CENTER : docx.AlignmentType.LEFT,
                children: [new docx.TextRun({
                  text: val,
                  bold: isBlueHeader,
                  size: isBlueHeader ? 18 : 16,
                  font: "Calibri"
                })]
              })],
              shading: isBlueHeader ? { fill: "BDD7EE", type: docx.ShadingType.CLEAR } : undefined, // नीला हेडर
              borders: {
                top: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                left: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
                right: { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" },
              }
            });
          });

          tableRows.push(new docx.TableRow({ children: rowCells }));
        }
      });

      status.innerText = "Word (.docx) फ़ाइल तैयार हो रही है...";

      const docTable = new docx.Table({
        rows: tableRows,
        width: { size: 100, type: docx.WidthType.PERCENTAGE }
      });

      const doc = new docx.Document({
        sections: [{
          properties: { page: { size: { orientation: docx.PageOrientation.LANDSCAPE } } }, // लैंडस्केप ताकि 8 कॉलम अच्छे से आएं
          children: [docTable]
        }]
      });

      const blob = await docx.Packer.toBlob(doc);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = file.name.replace(".pdf", "") + "_exact.docx";
      link.click();

      status.innerText = "सफलतापूर्वक पूरा हुआ! नई Word फ़ाइल डाउनलोड हो गई।";
    } catch (err) {
      console.error(err);
      status.innerText = "त्रुटि: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
