<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal PDF to Word Converter</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 25px; max-width: 580px; margin: auto; background: #f8fafc; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #0f172a; font-size: 20px; }
    input[type="file"] { width: 100%; margin: 15px 0; }
    button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #bae6fd; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; color: #334155; font-weight: 500; }
    .log { font-size: 12px; color: #64748b; margin-top: 10px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

<div class="card">
  <h2>यूनिवर्सल PDF to Word कनवर्टर</h2>
  <p style="font-size: 13px; color: #64748b;">कोई भी PDF (स्कैन या डिजिटल) अपलोड करें — टेबल, फ़ॉर्मेटिंग और टेक्स्ट अपने आप कन्वर्ट होंगे:</p>
  
  <input type="file" id="pdfInput" accept="application/pdf">
  <button id="convertBtn" onclick="processPDF()">Word (.docx) में बदलें</button>
  
  <div id="status"></div>
  <div class="log" id="log"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function processPDF() {
    const fileInput = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const log = document.getElementById('log');
    const btn = document.getElementById('convertBtn');

    if (!fileInput.files[0]) {
      alert("कृपया एक PDF फ़ाइल चुनें!");
      return;
    }

    btn.disabled = true;
    log.innerText = "";
    status.innerText = "PDF का विश्लेषण शुरू हो रहा है...";

    try {
      const file = fileInput.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let docSections = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        status.innerText = `पेज ${pageNum} / ${pdf.numPages} प्रोसेस हो रहा है...`;
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();

        let extractedWords = [];

        // चरण 1: ऑटो-डिटेक्ट (डिजिटल टेक्स्ट है या इमेज स्कैन?)
        if (textContent.items.length > 5) {
          log.innerText = `पेज ${pageNum}: डिजिटल टेक्स्ट मिला (Direct Extract)`;
          extractedWords = textContent.items
            .filter(item => item.str.trim() !== "")
            .map(item => ({
              text: item.str,
              x: item.transform[4],
              y: item.transform[5],
              fontSize: Math.round(Math.hypot(item.transform[0], item.transform[1])) || 10,
              isBold: item.fontName ? item.fontName.toLowerCase().includes("bold") : false
            }));
        } else {
          log.innerText = `पेज ${pageNum}: इमेज स्कैन मिला (Running OCR...)`;
          const viewport = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const worker = await Tesseract.createWorker('eng');
          const ret = await worker.recognize(canvas);
          await worker.terminate();

          extractedWords = (ret.data.words || []).map(w => ({
            text: w.text,
            x: w.bbox.x0 / 2, // 2.0 स्केल को नॉर्मलाइज़ करना
            y: (viewport.height - w.bbox.y0) / 2,
            fontSize: 10,
            isBold: false
          }));
        }

        // चरण 2: डायनेमिक लेआउट इंजन (Y-एक्सिस पर पंक्तियाँ बनाना)
        const lineTolerance = 6;
        const rowsMap = new Map();

        extractedWords.forEach(w => {
          let matchedY = null;
          for (let yKey of rowsMap.keys()) {
            if (Math.abs(yKey - w.y) <= lineTolerance) {
              matchedY = yKey;
              break;
            }
          }
          if (matchedY !== null) {
            rowsMap.get(matchedY).push(w);
          } else {
            rowsMap.set(w.y, [w]);
          }
        });

        // ऊपर से नीचे रो सॉर्ट करना
        const sortedY = Array.from(rowsMap.keys()).sort((a, b) => b - a);

        let pageElements = [];
        let accumulatedTableRows = [];

        sortedY.forEach(y => {
          let row = rowsMap.get(y).sort((a, b) => a.x - b.x);

          // शब्दों के बीच की हॉरिजॉन्टल दूरी (Gap) देखकर तय करना कि यह टेबल का हिस्सा है या सादा पैराग्राफ
          let isTableRow = false;
          let columns = [];
          let currentCell = [row[0].text];

          for (let i = 1; i < row.length; i++) {
            const gap = row[i].x - (row[i-1].x + (row[i-1].text.length * 6));
            if (gap > 20) { 
              // अगर शब्दों में 20px से बड़ा गैप है, तो वह अलग कॉलम है
              columns.push(currentCell.join(" "));
              currentCell = [row[i].text];
            } else {
              currentCell.push(row[i].text);
            }
          }
          columns.push(currentCell.join(" "));

          // अगर 2 से ज़्यादा कॉलम हैं, तो टेबल रो बनाओ
          if (columns.length >= 2) {
            const cells = columns.map(cText => new docx.TableCell({
              children: [new docx.Paragraph({
                children: [new docx.TextRun({ text: cText, size: 18 })]
              })],
              borders: {
                top: { style: docx.BorderStyle.SINGLE, size: 1, color: "CCCCCC" },
                bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "CCCCCC" },
                left: { style: docx.BorderStyle.SINGLE, size: 1, color: "CCCCCC" },
                right: { style: docx.BorderStyle.SINGLE, size: 1, color: "CCCCCC" },
              }
            }));
            accumulatedTableRows.push(new docx.TableRow({ children: cells }));
          } else {
            // सादा पैराग्राफ
            if (accumulatedTableRows.length > 0) {
              pageElements.push(new docx.Table({ rows: accumulatedTableRows, width: { size: 100, type: docx.WidthType.PERCENTAGE } }));
              accumulatedTableRows = [];
            }
            const lineText = row.map(r => r.text).join(" ");
            pageElements.push(new docx.Paragraph({
              children: [new docx.TextRun({
                text: lineText,
                bold: row.some(r => r.isBold),
                size: Math.max(16, (row[0].fontSize || 10) * 1.6)
              })],
              spacing: { after: 100 }
            }));
          }
        });

        if (accumulatedTableRows.length > 0) {
          pageElements.push(new docx.Table({ rows: accumulatedTableRows, width: { size: 100, type: docx.WidthType.PERCENTAGE } }));
        }

        docSections.push({ children: pageElements });
      }

      status.innerText = "Word (.docx) फ़ाइल तैयार हो रही है...";
      const doc = new docx.Document({ sections: docSections });
      const blob = await docx.Packer.toBlob(doc);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = file.name.replace(".pdf", "") + "_universal.docx";
      link.click();

      status.innerText = "सफलतापूर्वक पूरा हुआ! Word फ़ाइल डाउनलोड हो गई।";
    } catch (err) {
      console.error(err);
      status.innerText = "त्रुटि: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
